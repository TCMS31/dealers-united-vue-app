services:
  web:
    build:
      context: .
      target: runtime
      args:
        # Point this at the Laravel backend. Baked in at build time, so a
        # different API means a rebuild, not a restart.
        VUE_APP_API_BASE_URL: ${VUE_APP_API_BASE_URL:-http://localhost/api/v1/}
        VUE_APP_DEMO: ${VUE_APP_DEMO:-false}
        VUE_APP_PAGE_SIZE: ${VUE_APP_PAGE_SIZE:-8}
    image: time-capsule-web:latest
    ports:
      - "${WEB_PORT:-8640}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
